<!-- Footer removed -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const currentPath = window.location.pathname.replace(/\/$/, ""); // remove trailing slash
    const menuLinks = document.querySelectorAll(".navbar a");

    menuLinks.forEach(link => {
      const linkPath = link.getAttribute("href").replace(/\/$/, "");
      if (linkPath === currentPath) {
        link.classList.add("active-link");
      }
    });

    const clickTimeFormatter = new Intl.DateTimeFormat(undefined, {
      dateStyle: "medium",
      timeStyle: "short"
    });

    const trackedLinkGroups = [
      {
        selector: ".opps-row > a",
        storagePrefix: "opps-last-click",
        timeClass: "opps-last-click",
        insertInsideLink: false
      },
      {
        selector: ".reading-links a",
        storagePrefix: "reading-last-click",
        timeClass: "reading-last-click",
        insertInsideLink: true
      }
    ];

    trackedLinkGroups.forEach(group => {
      document.querySelectorAll(group.selector).forEach(link => {
        const storageKey = `${group.storagePrefix}:${link.href}`;
        const lastClicked = document.createElement("time");
        lastClicked.className = group.timeClass;

        const showClickTime = timestamp => {
          if (timestamp === null) {
            lastClicked.removeAttribute("datetime");
            lastClicked.textContent = "Never clicked";
            return;
          }

          const clickedAt = new Date(Number(timestamp));

          if (Number.isNaN(clickedAt.getTime())) {
            lastClicked.removeAttribute("datetime");
            lastClicked.textContent = "Never clicked";
            return;
          }

          lastClicked.dateTime = clickedAt.toISOString();
          lastClicked.textContent = clickTimeFormatter.format(clickedAt);
        };

        try {
          showClickTime(localStorage.getItem(storageKey));
        } catch (error) {
          showClickTime(null);
        }

        const timestampContainer = group.insertInsideLink ? link : link.parentElement;
        timestampContainer.appendChild(lastClicked);

        link.addEventListener("click", () => {
          const timestamp = Date.now();

          try {
            localStorage.setItem(storageKey, String(timestamp));
          } catch (error) {
            // Still update the current page when browser storage is unavailable.
          }

          showClickTime(timestamp);
        });
      });
    });
  });
</script>
